# macOS drops ._ metadata files next to every file on the shared USB drive
extend-exclude = ["._*"]

line-length = 120
extend-exclude = ["._*"]

[lint]
ignore = [
    # The brief says an API failure must never crash the app, so each AI step and
    # API client catches Exception on purpose, logs it and carries on.
    "BLE001",
    # Class-level lookup tables (schemas, display names) are read-only constants.
    "RUF012",
]
