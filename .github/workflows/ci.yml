name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/io-and-location" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Caching speeds up dependency installation
          cache-dependency-path: "library.txt"

      # 3. Install dependencies from library.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r library.txt
          pip install pytest ruff

      # 4. Ruff (advisory in Sprint 1, blocking in Sprint 2)
      # continue-on-error keeps the pipeline going but still flags the step in the
      # UI, unlike "|| true", which hides real crashes and shows a green tick.
      # SPRINT 2: delete the `continue-on-error` line to make this blocking.
      # TODO: link the issue tracking this change here.
      - name: Run Ruff Check
        continue-on-error: true
        run: ruff check .
 
      # 5. Pytest
      # TEMPORARY while tests don't exist yet: tolerates "no tests collected" (5)
      # and "tests/ not found" (4). Real test failures still fail the job.
      # Once tests exist, replace this step with the FINAL (blocking) version below.
      - name: Run Pytest
        run: |
          rc=0
          pytest tests/ || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 4 ] || [ "$rc" -eq 5 ]; then exit 0; fi
          exit "$rc"
      # FINAL (blocking):
      # - name: Run Pytest
      #   run: pytest tests/
 
      # 6. Docker build (validation only, no push), with GitHub Actions layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
