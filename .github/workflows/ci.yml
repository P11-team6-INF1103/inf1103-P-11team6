name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Caching speeds up dependency installation
          cache-dependency-path: "requirements.txt"

      # 3. Install dependencies from requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.17.2

      # 4. Ruff (blocking)
      - name: Run Ruff Check
        run: ruff check .

      # 5. Pytest (blocking: any failure or an empty test run fails the job)
      - name: Run Pytest
        run: pytest -v

      # - name: Set up Node 22  
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: "npm"
      #     cache-dependency-path: "frontend/package-lock.json"

      # - name: Build React Dashboard
      #   working-directory: frontend
      #   run: |
      #     npm ci
      #     npm run build

      - name: Build Docker Image
        run: docker build -t app:latest .

      - name: Run Tests In The Container
        run: docker run --rm app:latest python -m pytest

      # Nothing is passed in: no API keys and no DATABASE_URL, which is how an assessor first runs the container.
      # Every AI step falls back to "needs manual review", incidents go to local files inside the container, and the
      # run must still finish and print the summary. The files disappear with the container.
      - name: Run Batch In The Container
        run: |
          set -o pipefail
          docker run --rm -e PYTHONUTF8=1 app:latest python main.py --batch tests/sample_batch.json | tee batch-output.txt
          grep -q "INCIDENT SUMMARY" batch-output.txt
          grep -q "Total incidents: 3" batch-output.txt

        # Replace run with the following after others setup is complete
        # set -o pipefail
